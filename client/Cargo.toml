[package]
name = "murr-bunker-game"
version = "0.1.0"
edition = "2021"
description = "Portable multiplayer Bunker game client"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts"] }
ewebsock = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12.1", features = ["json"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true

name: Check Cloudflare server

on:
  push:
    branches: [main, feature/pdf-ui-lobby-ready-20261111]
    paths:
      - "server/**"
      - "web/**"
      - "tools/**"
      - "packs/**"
      - ".github/workflows/server-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "tools/**"
      - "packs/**"
      - ".github/workflows/server-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check
      - run: node --check ../web/app.js
